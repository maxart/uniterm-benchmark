name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable test --all-targets --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable build --release --locked
      - run: cargo +stable package --list --locked
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check-publication.py
      - run: python3 scripts/check-package.py
      - name: Scan working tree and full history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          trap 'rm -rf "$scanner_dir"' EXIT
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' checksums.txt | sha256sum --check --strict -)
          tar -xzf "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --no-banner .
          "$scanner_dir/gitleaks" dir --redact=100 --ignore-gitleaks-allow --no-banner .
